<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>勞工權益計算機｜加班費、特休、資遣費、離職預告期試算</title>
  <meta name="description" content="免費的勞工權益試算工具：加班費、特休天數、資遣費、離職預告期等，依勞基法規定快速計算。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>勞工權益計算機</h1>
    <p class="sub">依勞基法規定，快速試算你的權益。</p>

    <a class="card tool" href="overtime.html">
      <h2>加班費試算</h2>
      <p>平日、休息日加班費怎麼算？輸入月薪和時數立即算出。</p>
    </a>

    <a class="card tool" href="annual-leave.html">
      <h2>特休天數試算</h2>
      <p>輸入到職日，算出你現在有幾天特休、下次什麼時候增加。</p>
    </a>

    <a class="card tool" href="severance.html">
      <h2>資遣費試算</h2>
      <p>被資遣可以領多少？輸入年資和平均月薪，依勞退新制計算。</p>
    </a>

    <a class="card tool" href="notice-period.html">
      <h2>離職預告期試算</h2>
      <p>要提前幾天說離職？輸入到職日和最後工作日，算出最晚提離職的日期。</p>
    </a>

    <p class="note">本站工具僅供參考，實際權益以勞動部規定及公司制度為準。</p>
  </main>
